name: Android CI/CD

# PRs:            analyze + unit tests + debug APK compile check (no secrets needed).
# Push to master: everything above, then a signed release AAB uploaded to Google Play.
# Manual run:     same as master push, with a choice of Play track.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track to publish to
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.41.6'
  JAVA_VERSION: '17'
  # Added to github.run_number to form versionCode. Bump this if Play already
  # has a higher versionCode from a manual upload.
  VERSION_CODE_OFFSET: 100

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # .env is a declared asset (pubspec.yaml) and gitignored. `flutter test`
      # and `flutter build` both bundle assets, so a placeholder must exist first.
      - name: Create placeholder .env
        run: cp .env.example .env

      # Errors and warnings block; infos (deprecations, style) are reported only.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # Gradle falls back to the debug key when android/key.properties is
      # absent, so this needs no secrets.
      - name: Compile check (debug APK)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

  release:
    name: Build & upload to Google Play
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env from GitHub Secrets
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CAFE_WEB_URL: ${{ secrets.CAFE_WEB_URL }}
          CHURCH_NAME: ${{ secrets.CHURCH_NAME }}
          CHURCH_SUBTITLE: ${{ secrets.CHURCH_SUBTITLE }}
          CHURCH_ADDRESS: ${{ secrets.CHURCH_ADDRESS }}
          CHURCH_SERVICE_TIMES: ${{ secrets.CHURCH_SERVICE_TIMES }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          LEGAL_ENTITY_NAME: ${{ secrets.LEGAL_ENTITY_NAME }}
          APP_NAME: ${{ secrets.APP_NAME }}
          PRIVACY_CONTACT_EMAIL: ${{ secrets.PRIVACY_CONTACT_EMAIL }}
          SUPPORT_CONTACT_EMAIL: ${{ secrets.SUPPORT_CONTACT_EMAIL }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
          GOVERNING_STATE: ${{ secrets.GOVERNING_STATE }}
          LEGAL_EFFECTIVE_DATE: ${{ secrets.LEGAL_EFFECTIVE_DATE }}
        run: |
          set -euo pipefail
          for key in BASE_URL CAFE_WEB_URL CHURCH_NAME CHURCH_SUBTITLE CHURCH_ADDRESS CHURCH_SERVICE_TIMES ONESIGNAL_APP_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              exit 1
            fi
          done
          cat > .env <<EOF
          BASE_URL=${BASE_URL}
          CAFE_WEB_URL=${CAFE_WEB_URL}
          CHURCH_NAME=${CHURCH_NAME}
          CHURCH_SUBTITLE=${CHURCH_SUBTITLE}
          CHURCH_ADDRESS=${CHURCH_ADDRESS}
          CHURCH_SERVICE_TIMES=${CHURCH_SERVICE_TIMES}
          ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID}
          LEGAL_ENTITY_NAME=${LEGAL_ENTITY_NAME}
          APP_NAME=${APP_NAME}
          PRIVACY_CONTACT_EMAIL=${PRIVACY_CONTACT_EMAIL}
          SUPPORT_CONTACT_EMAIL=${SUPPORT_CONTACT_EMAIL}
          MAILING_ADDRESS=${MAILING_ADDRESS}
          GOVERNING_STATE=${GOVERNING_STATE}
          LEGAL_EFFECTIVE_DATE=${LEGAL_EFFECTIVE_DATE}
          EOF
          echo "Wrote .env with $(wc -l < .env) keys (values not printed)."

      - name: Install upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required signing secret: $key"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=${KEYSTORE_PATH}
          EOF
          # Fail fast with a clear message if the keystore/alias/password don't line up.
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null
          echo "Keystore installed and verified."

      - run: flutter pub get

      - name: Build release App Bundle
        id: build
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(( ${{ github.run_number }} + VERSION_CODE_OFFSET ))
          echo "versionCode=$BUILD_NUMBER"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"

          AAB=build/app/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

          # R8 mapping file lets Play de-obfuscate crash reports; absent if shrinking is off.
          MAPPING=build/app/outputs/mapping/release/mapping.txt
          if [ -f "$MAPPING" ]; then
            echo "mapping=$MAPPING" >> "$GITHUB_OUTPUT"
          else
            echo "mapping=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-aab
          path: |
            ${{ steps.build.outputs.aab }}
            ${{ steps.build.outputs.mapping }}
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.RejoiceGreatly.app
          releaseFiles: ${{ steps.build.outputs.aab }}
          mappingFile: ${{ steps.build.outputs.mapping }}
          track: ${{ github.event.inputs.track || 'internal' }}
          # A production dispatch lands as a draft release so rollout is confirmed
          # in Play Console rather than going straight to 100% of users.
          status: ${{ github.event.inputs.track == 'production' && 'draft' || 'completed' }}

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks" .env || true
